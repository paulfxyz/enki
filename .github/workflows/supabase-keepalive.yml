name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days without API-gateway
# activity. Management-API SQL does NOT count — only requests that hit
# the project's REST/auth gateway do. This pings the PostgREST root
# daily with the public anon key (the same key the enki.ngo form uses
# client-side, so it is public by design).

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST gateway
        env:
          SUPABASE_URL: https://slrzxnalnpitwyvzzxme.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_c2gNflxvwF_g9pidq0ZTSA_RnkJVC5D
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "REST gateway responded: $code"
          case "$code" in
            2*) exit 0 ;;
            *)  echo "Keep-alive ping failed (project may be paused)"; exit 1 ;;
          esac
